services:
  postgres:
    image: postgres:16-alpine
    container_name: teamspace-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: teamspace
      POSTGRES_PASSWORD: teamspace
      POSTGRES_DB: teamspace
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U teamspace -d teamspace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
