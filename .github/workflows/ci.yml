name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "feat/**"

# Cancela runs anteriores en el mismo ref cuando llega uno nuevo.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, tests y build
    runs-on: ubuntu-latest

    # DATABASE_URL apunta al service container de Postgres expuesto en localhost:5432.
    # Lo consumen db:migrate, los tests de integración (Vitest, env node) y el build.
    env:
      DATABASE_URL: postgresql://teamspace:teamspace@localhost:5432/teamspace

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: teamspace
          POSTGRES_PASSWORD: teamspace
          POSTGRES_DB: teamspace
        ports:
          - 5432:5432
        # Healthcheck con pg_isready para no arrancar los pasos antes de que Postgres
        # acepte conexiones (evita ECONNREFUSED en migrate/test).
        options: >-
          --health-cmd "pg_isready -U teamspace -d teamspace"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Habilitar corepack (pnpm 10.22.0)
        run: |
          corepack enable
          corepack prepare pnpm@10.22.0 --activate

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Aplicar migraciones
        run: pnpm run db:migrate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Tests
        run: pnpm run test

      # Gate "deployable": verifica que la app compila para producción.
      # NOTA CD: el deploy real requiere configurar un target (Vercel / Docker registry /
      # etc.) y sus secrets. Cuando eso exista, agregar un workflow deploy.yml separado.
      - name: Build
        run: pnpm run build
